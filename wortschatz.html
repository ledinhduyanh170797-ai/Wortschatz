<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Wortschatz A1–B1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#EEF1F4;--surface:#FFFFFF;--ink:#17202B;--muted:#5D6875;--line:#D5DBE2;--soft:#E3E8EE;
--der:#2457C5;--die:#C8312B;--das:#2F8F4E;--pl:#7A3DB8;--ok:#2F8F4E;--bad:#C8312B;--warn:#B7791F;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171D;--surface:#1C232C;--ink:#E8EDF2;--muted:#9AA6B3;--line:#2E3843;--soft:#252E38;--der:#6E9BFF;--die:#FF6B63;--das:#5BC37E;--pl:#B88CF0;--ok:#5BC37E;--bad:#FF6B63;--warn:#E3B04B}}
:root[data-theme="dark"]{--bg:#12171D;--surface:#1C232C;--ink:#E8EDF2;--muted:#9AA6B3;--line:#2E3843;--soft:#252E38;--der:#6E9BFF;--die:#FF6B63;--das:#5BC37E;--pl:#B88CF0;--ok:#5BC37E;--bad:#FF6B63;--warn:#E3B04B}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 32px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:8px 0 14px}
h1{font-size:26px;line-height:1.1;margin:0;font-weight:800;letter-spacing:-.02em}
h1 .flag{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
h1 .flag i{display:block;width:8px;height:20px;border-radius:2px}
.stat{font-size:13px;color:var(--muted);text-align:right}
.stat b{color:var(--ink);font-size:18px;display:block}
.filters{display:grid;grid-template-columns:auto 1fr;gap:8px;margin-bottom:12px}
select,input[type=text]{font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
select:focus,input:focus,button:focus-visible{outline:3px solid color-mix(in srgb,var(--der) 45%,transparent);outline-offset:1px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);background:var(--soft);border-radius:14px;padding:4px;margin-bottom:16px}
.tabs button{font:inherit;font-weight:600;font-size:14px;border:0;background:transparent;color:var(--muted);padding:9px 4px;border-radius:10px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.card{background:var(--surface);border-radius:22px;padding:22px 20px;border:1.5px solid var(--line);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--g,var(--line));transition:background .25s}
.meta{font-size:12.5px;color:var(--muted);display:flex;justify-content:space-between;gap:8px}
.vn{font-size:24px;font-weight:700;margin:18px 0 6px;line-height:1.3}
.de{font-size:30px;font-weight:800;letter-spacing:-.01em;line-height:1.2;margin:16px 0 2px;color:var(--g,var(--ink))}
.pl{font-size:14px;color:var(--muted)}
.ex{margin-top:14px;padding-top:12px;border-top:1px dashed var(--line);font-style:italic;color:var(--ink)}
.hidden{display:none!important}
.btn{font:inherit;font-weight:700;border:0;border-radius:14px;padding:14px 12px;cursor:pointer;background:var(--ink);color:var(--surface);width:100%;font-size:16px}
.btn.ghost{background:var(--soft);color:var(--ink)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.reveal{margin-top:16px}
.arts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:18px}
.arts button{font:inherit;font-weight:800;font-size:20px;border-radius:16px;padding:18px 0;cursor:pointer;background:var(--surface);border:2px solid var(--a);color:var(--a)}
.arts button.on{background:var(--a);color:var(--surface)}
.noun{font-size:32px;font-weight:800;margin:20px 0 4px}
.typing{display:flex;gap:8px;margin-top:16px}
.typing input{font-size:18px}
.keys{display:flex;gap:6px;margin-top:8px}
.keys button{font:inherit;font-weight:600;background:var(--soft);border:0;border-radius:10px;padding:8px 0;flex:1;color:var(--ink);cursor:pointer}
.verdict{margin-top:14px;font-weight:700;font-size:17px}
.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}.verdict.warn{color:var(--warn)}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:12.5px;color:var(--muted);margin:14px 2px 0}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--c);margin-right:5px}
.bar{height:6px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--ok);width:0;transition:width .4s}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:18px;font-size:13px;color:var(--muted)}
.foot button,.foot-btn{font:inherit;font-size:13px;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer}

.tabs{grid-template-columns:repeat(4,1fr)}
.tabs button{font-size:13px}
.toolbar{display:flex;gap:8px;margin-bottom:12px}
.toolbar input{flex:1}
.add{font:inherit;font-weight:700;border:0;border-radius:12px;padding:0 14px;background:var(--ink);color:var(--surface);cursor:pointer;white-space:nowrap}
.list h2{font-size:15px;font-weight:700;margin:18px 2px 8px;color:var(--muted)}
.item{background:var(--surface);border:1.5px solid var(--line);border-left:6px solid var(--g);border-radius:14px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.item .w{font-weight:700;color:var(--g)}
.item .t{color:var(--ink)}
.item .s{font-size:13px;color:var(--muted)}
.item .x{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);font-size:14px}
.item .mine{font-size:11px;font-weight:700;color:var(--surface);background:var(--muted);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:2px}
.item .acts{display:flex;gap:8px;margin-top:8px}
.item .acts button{font:inherit;font-size:13px;font-weight:600;border:0;border-radius:10px;padding:6px 12px;background:var(--soft);color:var(--ink);cursor:pointer}
.count{font-size:13px;color:var(--muted);margin:0 2px 4px}
.studybtn{margin:4px 0 6px}
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet .panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px))}
.panel h3{margin:0 0 12px;font-size:20px}
.panel label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:10px 0 4px}
.panel .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.panel .err{color:var(--bad);font-weight:600;font-size:14px;margin-top:8px}
.backup{display:flex;gap:14px;justify-content:center;margin-top:10px}

.seg{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-bottom:14px}
.seg button{font:inherit;font-weight:800;font-size:15px;border:2px solid var(--ink);background:transparent;color:var(--ink);border-radius:14px;padding:10px;cursor:pointer}
.seg button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.lesson{background:var(--surface);border:1.5px solid var(--line);border-radius:18px;padding:14px 16px;margin-bottom:10px;cursor:pointer;display:flex;gap:12px;align-items:center}
.lesson .n{font-weight:800;font-size:22px;color:var(--muted);width:28px;text-align:center}
.lesson .b{flex:1;min-width:0}.lesson .tt{font-weight:700}.lesson .ss{font-size:13px;color:var(--muted)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--muted);white-space:nowrap}
.pill.good{background:color-mix(in srgb,var(--ok) 18%,transparent);color:var(--ok)}
.mixed{width:100%;margin-bottom:14px}
.back{font:inherit;font-weight:600;border:0;background:none;color:var(--muted);padding:4px 0;margin-bottom:8px;cursor:pointer}
.glevel{font-size:12.5px;font-weight:700;color:var(--muted)}.gtitle{margin:2px 0 6px;font-size:24px;letter-spacing:-.01em}
.theory{font-size:15.5px}.theory h3{font-size:17px;margin:20px 0 6px}.theory p{margin:6px 0}
.theory .tip{background:color-mix(in srgb,var(--warn) 14%,transparent);border-radius:12px;padding:8px 12px}
.theory .ex{border:0;font-style:normal;background:var(--soft);border-radius:12px;padding:8px 12px;margin:8px 0}
.tw{overflow-x:auto;margin:8px 0}.tw table{border-collapse:collapse;width:100%;font-size:14px;background:var(--surface)}
.tw th,.tw td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}.tw th{background:var(--soft)}
.der{color:var(--der)}.die{color:var(--die)}.das{color:var(--das)}
.gq{font-size:20px;font-weight:700;margin:16px 0 4px;line-height:1.4}
.gopts{display:grid;gap:8px;margin-top:14px}
.gopts button{font:inherit;font-size:16px;font-weight:600;text-align:left;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;cursor:pointer}
.gopts button.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 15%,transparent)}
.gopts button.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 12%,transparent)}
#gq-fill{margin-top:14px}#gq-fill input{font-size:18px}
.gscore{font-size:44px;font-weight:800;text-align:center;margin-top:6px}
#gq-msg{text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
<header>
 <h1>Wortschatz<span class="flag" aria-hidden="true"><i style="background:var(--der)"></i><i style="background:var(--die)"></i><i style="background:var(--das)"></i></span></h1>
 <div class="stat"><b id="known">0</b>từ đã thuộc / <span id="total">0</span><div class="bar"><i id="progress"></i></div></div>
</header>
<div class="seg" role="tablist"><button data-sec="vocab" aria-selected="true">Từ vựng</button><button data-sec="gram" aria-selected="false">Ngữ pháp</button></div>
<div id="vocab">
<div class="filters">
 <select id="level" aria-label="Trình độ"><option value="">Tất cả</option><option>A1</option><option>A2</option><option>B1</option></select>
 <select id="topic" aria-label="Chủ đề"></select>
</div>
<div class="tabs" role="tablist">
 <button role="tab" data-mode="list" aria-selected="true">Danh sách</button>
 <button role="tab" data-mode="card" aria-selected="false">Thẻ từ</button>
 <button role="tab" data-mode="type" aria-selected="false">Trả bài</button>
 <button role="tab" data-mode="art" aria-selected="false">der·die·das</button>
</div>

<section id="listview">
 <div class="toolbar"><input type="text" id="search" placeholder="Tìm từ (Đức hoặc Việt)" autocomplete="off"><button class="add" id="btn-add">+ Thêm từ</button></div>
 <div class="count" id="count"></div>
 <div class="row studybtn"><button class="btn ghost" data-go="card">Học thẻ nhóm này</button><button class="btn" data-go="type">Trả bài nhóm này</button></div>
 <div class="list" id="list"></div>
</section>
<section class="card hidden" id="card">
 <div class="meta"><span id="m-topic"></span><span id="m-box"></span></div>
 <div id="q-vn" class="vn"></div>
 <div id="q-noun" class="noun hidden"></div>

 <div id="answer" class="hidden">
  <div id="a-de" class="de"></div>
  <div id="a-pl" class="pl"></div>
  <div id="a-vn" class="pl hidden"></div>
  <div id="a-ex" class="ex"></div>
 </div>

 <div id="ui-card">
  <button class="btn reveal" id="btn-reveal">Xem đáp án</button>
  <div class="row hidden" id="grade">
   <button class="btn ghost" id="btn-no">Chưa thuộc</button>
   <button class="btn" id="btn-yes">Đã thuộc</button>
  </div>
 </div>

 <div id="ui-type" class="hidden">
  <div class="typing">
   <input type="text" id="inp" placeholder="vd: der Bahnhof" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
  </div>
  <div class="keys"><button data-k="ä">ä</button><button data-k="ö">ö</button><button data-k="ü">ü</button><button data-k="ß">ß</button><button data-k="Ä">Ä</button><button data-k="Ö">Ö</button><button data-k="Ü">Ü</button></div>
  <div id="verdict" class="verdict"></div>
  <div class="row"><button class="btn ghost" id="btn-skip">Bỏ qua</button><button class="btn" id="btn-check">Kiểm tra</button></div>
 </div>

 <div id="ui-art" class="hidden">
  <div class="arts">
   <button style="--a:var(--der)" data-a="der">der</button>
   <button style="--a:var(--die)" data-a="die">die</button>
   <button style="--a:var(--das)" data-a="das">das</button>
  </div>
  <div id="verdict2" class="verdict"></div>
  <button class="btn hidden" id="btn-next2" style="margin-top:14px">Từ tiếp theo</button>
 </div>
</section>

<div class="legend"><span style="--c:var(--der)">der</span><span style="--c:var(--die)">die</span><span style="--c:var(--das)">das</span><span style="--c:var(--pl)">chỉ số nhiều</span></div>
</div>
<div id="gram" class="hidden">
 <div id="g-list"></div>
 <div id="g-lesson" class="hidden">
  <button class="back" id="g-back1">← Danh sách bài</button>
  <div class="glevel" id="gl-lvl"></div><h2 class="gtitle" id="gl-title"></h2>
  <div class="theory" id="gl-theory"></div>
  <button class="btn" id="gl-start" style="margin-top:18px"></button>
 </div>
 <div id="g-quiz" class="hidden">
  <button class="back" id="g-back2">← Thoát bài tập</button>
  <section class="card" id="gq-card">
   <div class="meta"><span id="gq-name"></span><span id="gq-pos"></span></div>
   <div class="bar"><i id="gq-bar"></i></div>
   <div class="gq" id="gq-q"></div>
   <div id="gq-opts" class="gopts"></div>
   <div id="gq-fill" class="hidden">
    <input type="text" id="gq-inp" placeholder="Nhập đáp án" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" enterkeyhint="done">
    <div class="keys" id="gq-keys"><button data-k="ä">ä</button><button data-k="ö">ö</button><button data-k="ü">ü</button><button data-k="ß">ß</button><button data-k="Ä">Ä</button><button data-k="Ö">Ö</button><button data-k="Ü">Ü</button></div>
   </div>
   <div id="gq-verdict" class="verdict"></div>
   <div id="gq-ex" class="ex hidden"></div>
   <button class="btn" id="gq-btn" style="margin-top:14px">Kiểm tra</button>
  </section>
  <section class="card hidden" id="gq-end">
   <div class="gscore" id="gq-score"></div><p id="gq-msg" class="pl"></p>
   <div class="row"><button class="btn ghost" id="gq-redo">Làm lại câu sai</button><button class="btn" id="gq-again">Làm lại từ đầu</button></div>
   <button class="btn ghost" id="gq-theory" style="margin-top:10px">Xem lại lý thuyết</button>
  </section>
 </div>
</div>
<div class="foot" id="foot"><span id="session">Hôm nay: 0 đúng · 0 sai</span><button id="reset">Xóa tiến độ</button></div>
<div class="backup"><button class="foot-btn" id="btn-export">Sao lưu từ của tôi</button><button class="foot-btn" id="btn-import">Nhập từ file sao lưu</button><input type="file" id="file" accept=".json,application/json" class="hidden"></div>
</div>

<div class="sheet hidden" id="sheet"><div class="panel" role="dialog" aria-labelledby="f-title">
 <h3 id="f-title">Thêm từ mới</h3>
 <div class="two">
  <div><label for="f-art">Mạo từ</label><select id="f-art"><option value="der">der</option><option value="die">die</option><option value="das">das</option><option value="die (Pl.)">die (chỉ số nhiều)</option><option value="">không có</option></select></div>
  <div><label for="f-lvl">Trình độ</label><select id="f-lvl"><option>A1</option><option>A2</option><option selected>B1</option><option>Khác</option></select></div>
 </div>
 <label for="f-word">Từ tiếng Đức (không cần gõ mạo từ)</label><input type="text" id="f-word" placeholder="vd: Bahnhof" autocomplete="off" autocapitalize="sentences" spellcheck="false">
 <label for="f-pl">Số nhiều</label><input type="text" id="f-pl" placeholder="vd: die Bahnhöfe (để trống nếu không có)" autocomplete="off">
 <label for="f-vn">Nghĩa tiếng Việt</label><input type="text" id="f-vn" placeholder="vd: nhà ga" autocomplete="off">
 <label for="f-ex">Câu ví dụ</label><input type="text" id="f-ex" placeholder="vd: Der Zug fährt vom Bahnhof ab." autocomplete="off">
 <label for="f-topic">Chủ đề</label><select id="f-topic"></select>
 <input type="text" id="f-newtopic" class="hidden" placeholder="Tên chủ đề mới" style="margin-top:8px" autocomplete="off">
 <div class="err" id="f-err"></div>
 <div class="row"><button class="btn ghost" id="f-cancel">Hủy</button><button class="btn" id="f-save">Lưu từ</button></div>
</div></div>

<script>
const T=(h,...r)=>`<div class="tw"><table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${r.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join("")}</tr>`).join("")}</table></div>`;
const MC=(q,opts,a,ex)=>({t:"mc",q,opts,a,ex});
const F=(q,a,ex)=>({t:"fill",q,a:[].concat(a),ex});
const GEN=(w,art,why)=>MC(`Mạo từ của „${w}“?`,["der","die","das"],art,`${art} ${w} — ${why}`);
const LESSONS=[
{id:"artikel",title:"Der Artikel",sub:"Mạo từ xác định, không xác định, khi nào bỏ mạo từ",lvl:"A1",
theory:`
<h3>1. Mạo từ xác định (der / das / die)</h3>
${T(["","Giống đực","Giống trung","Giống cái","Số nhiều"],
["Nom.","<b>der</b> Stuhl","<b>das</b> Kind","<b>die</b> Katze","<b>die</b> Kinder"],
["Akk.","<b>den</b> Stuhl","<b>das</b> Kind","<b>die</b> Katze","<b>die</b> Kinder"],
["Dat.","<b>dem</b> Stuhl","<b>dem</b> Kind","<b>der</b> Katze","<b>den</b> Kinder<b>n</b>"],
["Gen.","<b>des</b> Stuhl<b>s</b>","<b>des</b> Kind<b>es</b>","<b>der</b> Katze","<b>der</b> Kinder"])}
<p class="tip">Chỉ giống đực mới đổi ở Akkusativ (der → den). Dativ số nhiều thêm <b>-n</b> vào danh từ.</p>
<h3>2. Mạo từ không xác định (ein / eine) và kein</h3>
${T(["","Giống đực","Giống trung","Giống cái","Số nhiều"],
["Nom.","ein","ein","eine","– / keine"],["Akk.","ein<b>en</b>","ein","eine","– / keine"],
["Dat.","ein<b>em</b>","ein<b>em</b>","ein<b>er</b>","– / kein<b>en</b>"],["Gen.","ein<b>es</b>","ein<b>es</b>","ein<b>er</b>","– / kein<b>er</b>"])}
<p>Số nhiều không có „ein“: ein Kind → Kinder. Phủ định: <b>kein</b> chia đuôi giống „ein“ (và giống „mein“ ở số nhiều).</p>
<h3>3. Giới từ + mạo từ viết gộp</h3>
<p><b>am</b> = an dem · <b>im</b> = in dem · <b>zum</b> = zu dem · <b>beim</b> = bei dem · <b>vom</b> = von dem · <b>ins</b> = in das · <b>zur</b> = zu der. Văn nói còn có ans, aufs, fürs, überm…</p>
<p>Hay gặp với thời gian (am Montag, im Juli), địa điểm đã xác định (ins Bett gehen), động từ danh hóa (zum Essen) và cụm cố định (zur Verfügung stellen).</p>
<h3>4. Khi nào dùng der/die/das, khi nào dùng ein?</h3>
<p><b>ein</b>: nhắc lần đầu, thứ mới. <b>der/die/das</b>: thứ đã nhắc trước đó, ai cũng biết (die Sonne), hoặc rõ từ tình huống (Der Zug kommt gleich).</p>
<p class="ex">Ich kaufe <b>ein</b> Auto. <b>Das</b> Auto ist rot.</p>
<h3>5. Không dùng mạo từ</h3>
<p>Tên người (Ich treffe Moritz), đa số tên thành phố và nước (in Berlin, aus Vietnam), chất liệu và khái niệm trừu tượng nói chung (Ich trinke gern Kaffee. Liebe macht blind), nghề/quốc tịch sau sein (Sie ist Ärztin), cụm cố định (Angst haben, Auto fahren).</p>
<p>Nhưng khi có tính từ hoặc chỉ một thứ cụ thể thì dùng lại mạo từ: Ich suche <b>einen</b> trockenen Rotwein. Sie ist <b>eine</b> erfahrene Ärztin.</p>
<h3>6. Tên địa lý CÓ mạo từ</h3>
<p>Nước đuôi -ei (<b>die</b> Türkei, Mongolei), nước số nhiều (<b>die</b> Niederlande, USA), <b>die</b> Schweiz, <b>der</b> Iran/Irak (có thể bỏ), vùng (<b>der</b> Schwarzwald), núi (<b>die</b> Alpen), sông hồ (<b>die</b> Donau, <b>der</b> Bodensee).</p>`,
ex:[
F("Ich sehe ___ Mann. (der → Akkusativ)","den","Giống đực ở Akkusativ: der → den."),
F("Wir helfen ___ Frau. (die → Dativ)","der","helfen + Dativ; giống cái ở Dativ: die → der."),

F("Ich habe ___ Bruder. (kein → Akkusativ)","keinen","Giống đực Akkusativ: kein → keinen."),
F("Ich kaufe ___ Fahrrad. Das Fahrrad ist alt. (mạo từ không xác định)","ein","Nhắc lần đầu → ein (das Fahrrad, Akkusativ giống trung không đổi)."),
F("Ich warte ___ Bahnhof. (an dem → viết gộp)","am","an + dem = am."),
MC("Wir gehen heute ___ Kino.",["ins","im","am"],"ins","Chỉ hướng đi vào → in + Akkusativ das = ins."),
MC("Wir treffen uns ___ Montag.",["am","im","um"],"am","Ngày trong tuần dùng am (an dem)."),
MC("Giới thiệu nghề nghiệp đơn giản: Sie ist ___ .",["Ärztin","eine Ärztin","die Ärztin"],"Ärztin","Sau sein + nghề nghiệp thường không dùng mạo từ."),
MC("Ich trinke gern ___ Tee.",["(không mạo từ)","den","einen"],"(không mạo từ)","Đồ uống/chất liệu nói chung → không mạo từ."),
MC("Er kommt aus ___ Türkei.",["der","die","(không mạo từ)"],"der","die Türkei luôn có mạo từ; aus + Dativ → der Türkei."),
MC("Wir fahren in ___ Schweiz.",["die","der","(không mạo từ)"],"die","die Schweiz có mạo từ; in + Akkusativ (hướng đi) → die Schweiz."),

MC("Ich suche ___ ruhige Wohnung.",["eine","die","(không mạo từ)"],"eine","Thứ chưa xác định, có tính từ mô tả → mạo từ không xác định.")]},

{id:"genus",title:"Das Substantiv – Genus",sub:"Đoán der/die/das qua đuôi từ và nhóm nghĩa",lvl:"A1",
theory:`
<p>Giống của danh từ phần lớn là quy ước, nên luôn học danh từ <b>kèm mạo từ và số nhiều</b>. Tuy vậy, nhiều đuôi từ giúp đoán khá chính xác. Số nhiều luôn là <b>die</b>.</p>
<h3><span class="der">der</span> – giống đực</h3>
<p>Người nam: der Vater, Sohn, Arzt. Đuôi chỉ người: -er (Lehrer), -ent/-ant (Student, Fabrikant), -eur (Friseur), -or (Autor), -ist (Polizist), -e (Kollege, Junge).</p>
<p>Đuôi <b>-ling, -ig, -ich</b>: der Frühling, Honig, Teppich. Đuôi -er chỉ dụng cụ: der Computer, Fernseher.</p>
<p>Danh từ từ động từ bỏ -en: der Flug, Plan, Beginn. Ngày, tháng, mùa: der Montag, Mai, Sommer. Mưa, tuyết: der Regen, Schnee. Hãng xe: der BMW. Rượu: der Wein (nhưng <b>das</b> Bier).</p>
<h3><span class="das">das</span> – giống trung</h3>
<p>Đuôi <b>-chen, -lein</b> (luôn là das, kể cả das Mädchen), <b>-um</b> (Museum), <b>-ma</b> (Thema), <b>-ment</b> (Instrument), <b>-o</b> (Kino, Radio).</p>
<p>Động từ danh hóa: das Essen, das Lesen. Đuôi -ing: das Training. Ngôn ngữ và màu sắc: das Deutsche, das Blau.</p>
<h3><span class="die">die</span> – giống cái</h3>
<p>Người nữ: die Mutter, Tochter. Đuôi <b>-ung, -heit, -keit, -schaft, -ei, -ität, -ion, -ik</b>: die Zeitung, Freiheit, Möglichkeit, Freundschaft, Bäckerei, Universität, Information, Musik.</p>
<p>Đa số danh từ đuôi <b>-e</b>: die Frage, Reise, Sprache (ngoại lệ: der Junge, der Kollege, das Auge, das Ende). Số đếm: die Eins. Hoa, cây: die Rose.</p>
<h3>Đuôi hai giống</h3>
${T(["Đuôi","Ví dụ"],["-nis","<b>die</b> Kenntnis · <b>das</b> Ereignis, Missverständnis"],["-tum","<b>der</b> Irrtum, Reichtum · <b>das</b> Eigentum"])}
<h3>Danh từ ghép</h3>
<p>Giống do <b>từ cuối</b> quyết định: das Haus + die Tür = <b>die</b> Haustür; die Haustür + der Schlüssel = <b>der</b> Haustürschlüssel.</p>
<p class="tip">Ngoại lệ hay gặp với -er: die Butter, die Mutter, die Schwester, das Fenster, das Messer, das Wasser, das Zimmer.</p>`,
ex:[GEN("Zeitung","die","đuôi -ung luôn là die."),GEN("Mädchen","das","đuôi -chen luôn là das."),GEN("Frühling","der","đuôi -ling là der."),
GEN("Museum","das","đuôi -um là das."),GEN("Freiheit","die","đuôi -heit là die."),GEN("Thema","das","đuôi -ma là das."),
GEN("Honig","der","đuôi -ig là der."),GEN("Universität","die","đuôi -ität là die."),GEN("Instrument","das","đuôi -ment là das."),
GEN("Information","die","đuôi -ion là die."),GEN("Computer","der","-er chỉ dụng cụ thường là der."),GEN("Bäckerei","die","đuôi -ei là die."),
GEN("Schwimmen","das","động từ danh hóa là das."),GEN("Schnee","der","mưa, tuyết thuộc giống đực."),GEN("Politik","die","đuôi -ik là die."),
GEN("Ereignis","das","-nis có thể die hoặc das; Ereignis là das."),GEN("Irrtum","der","-tum có thể der hoặc das; Irrtum là der."),
GEN("Kinderzimmer","das","danh từ ghép theo từ cuối: das Zimmer."),GEN("Autoschlüssel","der","danh từ ghép theo từ cuối: der Schlüssel."),
GEN("Auge","das","ngoại lệ của đuôi -e."),GEN("Kollege","der","người nam, dù có đuôi -e."),GEN("Fenster","das","ngoại lệ của đuôi -er."),
GEN("Freundschaft","die","đuôi -schaft là die."),GEN("Dienstag","der","ngày trong tuần là der.")]},

{id:"plural",title:"Das Substantiv – Plural & Kasus",sub:"5 dạng số nhiều, n-Deklination, Genitiv",lvl:"A1–B1",
theory:`
<h3>1. Năm dạng số nhiều</h3>
${T(["Dạng","Quy tắc","Ví dụ"],["-(e)n","đuôi -e thêm -n, còn lại -en; không Umlaut","die Lampe → Lampen, die Uhr → Uhren"],
["-e","chủ yếu der/das; der hay có Umlaut","der Hund → Hunde, der Stuhl → Stühle"],["-er","chủ yếu das, thường có Umlaut; die không có","das Haus → Häuser"],
["-s","cả 3 giống, từ mượn, đuôi nguyên âm; không Umlaut","das Kino → Kinos"],["Ø","không thêm đuôi, chủ yếu der -er/-el/-en; đôi khi Umlaut","der Lehrer → Lehrer, der Vater → Väter"])}
<p>Danh từ nữ đuôi -in thêm <b>-nen</b>: die Lehrerin → Lehrerinnen. Dativ số nhiều thêm <b>-n</b> nếu chưa có: den Kinder<b>n</b>.</p>
<h3>2. n-Deklination (danh từ giống đực yếu)</h3>
<p>Một nhóm danh từ giống đực thêm <b>-(e)n</b> ở Akkusativ, Dativ và Genitiv; chỉ Nominativ giữ nguyên.</p>
${T(["","Số ít","Số nhiều"],["Nom.","der Junge","die Jungen"],["Akk.","den Junge<b>n</b>","die Jungen"],["Dat.","dem Junge<b>n</b>","den Jungen"],["Gen.","des Junge<b>n</b>","der Jungen"])}
<p>Nhận biết: người/động vật/quốc tịch đuôi <b>-e</b> (Kollege, Kunde, Löwe, Franzose), đuôi <b>-ist, -ent, -ant, -at, -oge</b> (Polizist, Student, Praktikant, Soldat, Biologe), và vài từ riêng: der Mensch, Herr (den Herr<b>n</b>), Nachbar, Bauer, Held.</p>
<p>Name, Gedanke, Buchstabe có Genitiv <b>-ns</b>: des Name<b>ns</b>. Duy nhất một từ giống trung: das Herz → des Herzens, dem Herzen.</p>
<h3>3. Genitiv với „von“</h3>
<p>Khi danh từ ở Genitiv <b>không có mạo từ hay tính từ</b> đi kèm, dùng <b>von + Dativ</b>: das Verbot <b>von</b> Alkohol. Có mạo từ/tính từ thì dùng Genitiv bình thường: das Verbot <b>des</b> Alkohols.</p>
<h3>4. Tên riêng</h3>
<p>Chỉ thêm <b>-s</b> ở Genitiv, đứng trước hoặc sau: <b>Annas</b> Auto = das Auto <b>Annas</b>.</p>
<h3>5. Dấu hiệu cách trên mạo từ</h3>
<p>Giống đực: de<b>r</b> → de<b>n</b> → de<b>m</b> → de<b>s</b> (Nom → Akk → Dat → Gen). Nhìn chữ cuối của mạo từ là đoán được cách.</p>`,
ex:[F("der Stuhl → die ___","Stühle","-e + Umlaut, kiểu điển hình của der."),F("die Lampe → die ___","Lampen","Đuôi -e → thêm -n."),
F("das Kino → die ___","Kinos","Đuôi nguyên âm -o → -s."),F("die Lehrerin → die ___","Lehrerinnen","Đuôi -in → -innen."),
F("der Bruder → die ___","Brüder","Ø-Plural + Umlaut."),F("das Haus → die ___","Häuser","-er + Umlaut, kiểu điển hình của das."),
F("der Lehrer → die ___","Lehrer","Ø-Plural: không thêm đuôi."),F("die Zeitung → die ___","Zeitungen","-ung → thêm -en."),
F("Ich helfe den ___ . (die Kinder, Dativ)","Kindern","Dativ số nhiều thêm -n."),
F("Ich kenne seinen ___ nicht. (der Name)","Namen","n-Deklination: Akkusativ thêm -n."),
F("Wir helfen dem neuen ___ . (der Kollege)","Kollegen","n-Deklination: Dativ thêm -n."),
F("Der Arzt untersucht den ___ . (der Patient)","Patienten","Đuôi -ent → n-Deklination: thêm -en."),
F("Ich spreche mit dem ___ . (der Nachbar)","Nachbarn","Nachbar thuộc n-Deklination: dem Nachbarn."),
F("Das ist das Buch des ___ . (der Student)","Studenten","Genitiv của n-Deklination: des Studenten (không thêm -s)."),
F("Guten Tag! Kennen Sie den ___ dort? (der Herr)","Herrn","der Herr → den Herrn (số ít), die Herren (số nhiều)."),
F("Die Bedeutung des ___ ist unklar. (der Name)","Namens","Name có Genitiv -ns: des Namens."),
F("Das ist ___ Fahrrad. (Anna, Genitiv)","Annas","Tên riêng ở Genitiv chỉ thêm -s."),
MC("Từ nào KHÔNG thuộc n-Deklination?",["der Lehrer","der Student","der Junge"],"der Lehrer","der Lehrer → den Lehrer (không thêm -n)."),
MC("das Verbot ___ Alkohol",["von","des"],"von","Không có mạo từ/tính từ → dùng von."),
MC("das Fahrrad ___ Bruders",["meines","von"],"meines","Có mạo từ sở hữu → Genitiv trực tiếp: meines Bruders.")]},

{id:"hilfsverb",title:"Das Hilfsverb",sub:"haben – sein – werden và 5 công thức vàng",lvl:"A1–B1",
theory:`
<h3>1. Bảng chia (ngôi ich / du / er / wir / ihr / sie)</h3>
${T(["","Präsens","Präteritum","Konj. I","Konj. II"],
["<b>haben</b>","habe, hast, hat, haben, habt, haben","hatte, hattest, hatte, hatten, hattet, hatten","habe, habest, habe, haben, habet, haben","hätte, hättest, hätte, hätten, hättet, hätten"],
["<b>sein</b>","bin, bist, ist, sind, seid, sind","war, warst, war, waren, wart, waren","sei, sei(e)st, sei, seien, seiet, seien","wäre, wär(e)st, wäre, wären, wär(e)t, wären"],
["<b>werden</b>","werde, wirst, wird, werden, werdet, werden","wurde, wurdest, wurde, wurden, wurdet, wurden","werde, werdest, werde, werden, werdet, werden","würde, würdest, würde, würden, würdet, würden"])}
<p>Partizip II: haben → <b>gehabt</b>, sein → <b>gewesen</b>, werden → <b>geworden</b>.</p>
<h3>2. Năm công thức vàng</h3>
${T(["Công thức","Dùng cho","Ví dụ"],["haben + Partizip II","Perfekt","Ich habe gelernt."],["sein + Partizip II","Perfekt (di chuyển, đổi trạng thái)","Ich bin gegangen."],
["werden + Infinitiv","Futur I","Ich werde morgen arbeiten."],["werden + Partizip II","Vorgangspassiv (quá trình)","Die Tür wird geöffnet."],["sein + Partizip II","Zustandspassiv (trạng thái, kết quả)","Die Tür ist geöffnet."])}
<p class="tip">werden → nhấn mạnh quá trình đang diễn ra. sein → nhấn mạnh kết quả đã có.</p>
<h3>3. Khi là động từ chính</h3>
<p><b>sein, werden, bleiben</b> nối chủ ngữ với tính từ, danh từ hoặc nơi chốn: Wir sind glücklich. Sie wird Ärztin (trở thành). Er bleibt hier.</p>
<p><b>haben</b> nghĩa „có, sở hữu“: Ich habe eine Wohnung.</p>`,
ex:[F("Du ___ heute sehr müde. (sein, Präsens)","bist","sein Präsens, du → bist."),F("Wir ___ gestern keine Zeit. (haben, Präteritum)","hatten","haben Präteritum, wir → hatten."),
F("Er ___ morgen nach Hamburg fahren. (Futur I)","wird","werden + Infinitiv = Futur; er → wird."),F("Ihr ___ letzte Woche in Wien. (sein, Präteritum)","wart","sein Präteritum, ihr → wart."),
F("Ich ___ im Mai 30 Jahre alt. (werden)","werde","werden = trở nên; ich → werde."),F("Sie (cô ấy) ___ viel gelernt. (Perfekt)","hat","lernen dùng haben; sie → hat."),
F("Wir ___ nach München gefahren. (Perfekt)","sind","fahren (di chuyển) dùng sein."),F("Das Fenster ___ gerade geöffnet. (Vorgangspassiv)","wird","Đang trong quá trình → werden + PII."),
F("Die Tür ___ schon geschlossen. (Zustandspassiv)","ist","Trạng thái kết quả → sein + PII."),F("Du ___ gestern krank. (sein, Präteritum)","warst","sein Präteritum, du → warst."),
F("Er sagt, er ___ krank. (sein, Konjunktiv I)","sei","Câu gián tiếp → Konjunktiv I: er sei."),F("Wenn ich Zeit ___, käme ich. (haben, Konjunktiv II)","hätte","Giả định → Konjunktiv II: hätte."),
F("Partizip II của „sein“:","gewesen","sein → ist gewesen."),F("Partizip II của „werden“:","geworden","werden → ist geworden."),
MC("„Ich habe ein Auto.“ – haben ở đây là:",["động từ chính (có)","trợ động từ"],"động từ chính (có)","Không có Partizip II đi kèm → haben là động từ chính."),
MC("„Sie wird Lehrerin.“ – werden ở đây nghĩa là:",["trở thành","sẽ (Futur)","bị động"],"trở thành","werden + danh từ = trở thành (Kopulaverb)."),
MC("„Das Haus wird gebaut.“ là:",["Vorgangspassiv","Zustandspassiv","Futur I"],"Vorgangspassiv","werden + Partizip II = bị động quá trình."),
MC("„Er wird morgen kommen.“ là:",["Futur I","Vorgangspassiv","Perfekt"],"Futur I","werden + Infinitiv = Futur I.")]},

{id:"vergangenheit",title:"Die Vergangenheit",sub:"Perfekt, Präteritum, Plusquamperfekt",lvl:"A2–B1",
theory:`
<h3>Tổng quan</h3>
${T(["Thì","Công thức","Dùng khi","Ví dụ"],["Perfekt","haben/sein + PII","nói, giao tiếp","Ich habe gegessen."],["Präteritum","dạng quá khứ của động từ","viết, kể chuyện, báo","Ich aß."],["Plusquamperfekt","hatte/war + PII","việc xảy ra trước một việc quá khứ khác","Ich hatte gegessen."])}
<h3>1. Perfekt: haben hay sein?</h3>
<p><b>sein</b> khi động từ không có tân ngữ trực tiếp và chỉ: <b>di chuyển</b> (fahren, gehen, fliegen, laufen), <b>thay đổi trạng thái</b> (aufstehen, einschlafen, aufwachen, sterben), và hai động từ <b>sein, bleiben</b>.</p>
<p><b>haben</b> với phần lớn động từ còn lại: có tân ngữ (Ich habe das Buch gelesen), phản thân (Er hat sich gefreut), và một số nội động từ (schlafen, arbeiten, blühen).</p>
<h3>2. Präteritum</h3>
<p>Động từ yếu thêm <b>-te-</b>: lieben → ich lieb<b>te</b>, du lieb<b>test</b>, wir lieb<b>ten</b>. Thân kết thúc -d/-t thêm -ete-: arbeitete, öffnete.</p>
<p>Động từ mạnh đổi nguyên âm, ich/er không có đuôi: rufen → rief, gehen → ging, sehen → sah. Động từ hỗn hợp vừa đổi nguyên âm vừa có -te-: denken → dachte, bringen → brachte, wissen → wusste.</p>
<p class="tip">Ngay cả khi nói, người Đức vẫn dùng Präteritum cho <b>war, hatte</b>, các Modalverb (<b>konnte, musste, wollte, sollte, durfte, mochte</b>) và <b>es gab</b>.</p>
<h3>3. Plusquamperfekt</h3>
<p><b>hatte/war + Partizip II</b>, cho hành động xảy ra <b>trước</b>. Hành động sau dùng Präteritum hoặc Perfekt. Hay đi với <b>nachdem</b>.</p>
<p class="ex">Nachdem ich gegessen <b>hatte</b>, ging ich schlafen.</p>`,
ex:[MC("Ich ___ gestern lange geschlafen.",["habe","bin"],"habe","schlafen không chỉ di chuyển hay thay đổi trạng thái → haben."),
MC("Er ___ um 6 Uhr aufgestanden.",["ist","hat"],"ist","aufstehen = thay đổi trạng thái → sein."),MC("Wir ___ zu Hause geblieben.",["sind","haben"],"sind","bleiben luôn dùng sein."),
MC("Sie ___ sich sehr geärgert.",["hat","ist"],"hat","Động từ phản thân → haben."),MC("Ihr ___ nach Köln geflogen.",["seid","habt"],"seid","fliegen (di chuyển) → sein; ihr → seid."),
MC("Ich ___ den Film schon gesehen.",["habe","bin"],"habe","Có tân ngữ trực tiếp (den Film) → haben."),MC("Das Baby ___ sofort eingeschlafen.",["ist","hat"],"ist","einschlafen = đổi trạng thái → sein."),
F("Ich ___ letzte Woche keine Zeit. (haben, Präteritum)","hatte","haben → hatte."),F("Wir ___ sehr müde. (sein, Präteritum)","waren","sein → waren."),
F("Er ___ gestern lange arbeiten. (müssen, Präteritum)","musste","müssen → musste (không Umlaut)."),F("Du ___ nicht kommen. (können, Präteritum)","konntest","können → konntest."),

{id:"konjunktiv",title:"Der Konjunktiv",sub:"Konjunktiv II (giả định, lịch sự) và Konjunktiv I (gián tiếp)",lvl:"B1",
theory:`
<p>Konjunktiv I và II <b>không phải là hai thì</b>; cả hai đều có dạng hiện tại và quá khứ. Khác nhau ở cách dùng.</p>
<h3>1. Konjunktiv II – cách tạo</h3>
<p><b>Dạng đơn</b> (từ Präteritum, thêm -e và Umlaut nếu có thể) dùng chủ yếu với: <b>wäre, hätte, würde</b>, Modalverb (<b>könnte, müsste, dürfte, sollte, wollte, möchte</b>) và vài động từ mạnh hay gặp (<b>käme, wüsste, ginge, ließe, bräuchte, nähme, gäbe, sähe, läge</b>).</p>
<p>Các động từ khác dùng <b>würde + Infinitiv</b>: ich würde arbeiten, du würdest kaufen. Hai dạng có cùng nghĩa.</p>
${T(["","Hiện tại","Quá khứ"],["Công thức","wäre / hätte / würde + Inf.","hätte / wäre + Partizip II"],["Ví dụ","Wenn ich Zeit hätte, würde ich kommen.","Wenn ich Zeit gehabt hätte, wäre ich gekommen."])}
<p class="tip">sollte và wollte trông giống hệt Präteritum; ngữ cảnh quyết định nghĩa.</p>
<h3>2. Konjunktiv II – cách dùng</h3>
<p><b>Mong ước</b> (thường có doch, nur, bloß): Wenn ich doch mehr Zeit hätte! / Hätte ich doch mehr Zeit!</p>
<p><b>Điều kiện không có thật</b>: Wenn ich reich wäre, würde ich ein Haus kaufen. (thực tế: không giàu)</p>
<p><b>So sánh không có thật</b> với als ob / als: Er tut so, als ob er der Chef wäre = als wäre er der Chef.</p>
<p><b>Lịch sự</b>: Könnten Sie mir helfen? Hätten Sie einen Moment Zeit? Ich hätte gern einen Kaffee.</p>
<p><b>Thận trọng, dè dặt</b>: Das wäre ja recht praktisch.</p>
<h3>3. Konjunktiv I – câu gián tiếp</h3>
<p>Tạo từ thân Präsens + đuôi có <b>-e-</b>: kommen → er komm<b>e</b>, können → er könn<b>e</b>, müssen → er müss<b>e</b>, haben → er hab<b>e</b>. sein đặc biệt: ich <b>sei</b>, du sei(e)st, er <b>sei</b>, wir <b>seien</b>, ihr seiet, sie <b>seien</b>.</p>
<p class="ex">Er sagt: „Ich bin krank.“ → Er sagt, er <b>sei</b> krank.</p>
<p>Khi dạng Konjunktiv I trùng với Präsens (hay gặp ở ich, wir, sie), dùng <b>Konjunktiv II</b> thay thế: Sie sagen, sie kommen → sie <b>kämen</b> morgen.</p>
<p>Quá khứ trong câu gián tiếp: habe/sei + Partizip II: Er sagt, er <b>habe</b> gearbeitet.</p>`,
ex:[F("Wenn ich mehr Geld ___, würde ich ein Auto kaufen. (haben)","hätte","Điều kiện không có thật → hätte."),F("Wenn ich du ___, würde ich das nicht machen. (sein)","wäre","Giả định → wäre."),
F("___ Sie mir bitte das Salz geben? (können, lịch sự)","Könnten","Lịch sự → Konjunktiv II: Könnten."),F("Er tut so, als ob er alles ___. (wissen)","wüsste","als ob + Konjunktiv II: wüsste."),
F("Sie spricht, als ___ sie Deutsche. (sein)","wäre","als (không ob) + động từ đứng ngay sau: als wäre sie…"),F("Ich ___ gern einen Tee. (mögen, lịch sự)","möchte","mögen → möchte."),
F("Wenn es doch endlich regnen ___!","würde","Mong ước với würde + Infinitiv."),F("Wenn er früher gekommen ___, hätte er den Bus bekommen.","wäre","kommen dùng sein → gekommen wäre (quá khứ)."),
F("Wenn sie mehr gelernt ___, hätte sie die Prüfung bestanden.","hätte","lernen dùng haben → gelernt hätte."),F("Er sagt, er ___ müde. (sein, câu gián tiếp)","sei","Konjunktiv I của sein: er sei."),
F("Sie sagt, sie ___ keine Zeit. (haben, câu gián tiếp)","habe","Konjunktiv I: sie habe."),F("Paul sagt, er ___ heute nicht kommen. (können, câu gián tiếp)","könne","Konjunktiv I: er könne."),
F("Lisa sagt, sie ___ noch arbeiten. (müssen, câu gián tiếp)","müsse","Konjunktiv I: sie müsse."),F("Die Kinder sagen, sie ___ morgen. (kommen, câu gián tiếp)","kämen","„sie kommen“ trùng Präsens → dùng Konjunktiv II: kämen."),
MC("„Er sagt, er sei müde.“ – „sei“ là:",["Konjunktiv I","Konjunktiv II","Präsens"],"Konjunktiv I","sei = Konjunktiv I của sein, dùng trong câu gián tiếp."),
MC("Câu nào là điều kiện không có thật ở QUÁ KHỨ?",["Wenn ich Zeit gehabt hätte, wäre ich gekommen.","Wenn ich Zeit hätte, käme ich.","Wenn ich Zeit habe, komme ich."],"Wenn ich Zeit gehabt hätte, wäre ich gekommen.","Quá khứ: hätte/wäre + Partizip II."),
MC("Konjunktiv II dạng đơn của „gehen“:",["ginge","ging","gehe"],"ginge","Präteritum ging + -e → ginge."),
MC("„Das wäre ja recht praktisch.“ dùng Konjunktiv II để:",["nói thận trọng, dè dặt","nói về quá khứ","thuật lại lời người khác"],"nói thận trọng, dè dặt","wäre làm câu nhẹ nhàng, không khẳng định quá mạnh.")]},

{id:"partizip",title:"Das Partizip",sub:"Partizip I (đang làm) và Partizip II (đã/được làm)",lvl:"A2–B1",
theory:`
<h3>1. Partizip I = Infinitiv + d</h3>
<p>singen → singen<b>d</b>, lesen → lesen<b>d</b>, schlafen → schlafen<b>d</b>. Luôn mang nghĩa <b>chủ động, đang diễn ra</b>.</p>
<p><b>Đứng trước danh từ</b>: chia đuôi như tính từ: der singend<b>e</b> Vogel, ein lachend<b>es</b> Kind, die singend<b>en</b> Kinder.</p>
<p><b>Làm trạng từ</b>: không chia đuôi: Er ging lachend davon. Sie kam weinend nach Hause.</p>
<p><b>Danh từ hóa</b>: viết hoa, chia như tính từ: der/die Reisende, die Lesenden.</p>
<p><b>zu + Partizip I</b> (B2): nghĩa bị động „cần/phải được…“: eine <b>zu erledigende</b> Arbeit = eine Arbeit, die erledigt werden muss.</p>
<h3>2. Cách tạo Partizip II</h3>
${T(["Nhóm","Quy tắc","Ví dụ"],["Động từ yếu","ge- + thân + -t","machen → gemacht"],["Thân -d/-t, -m/-n sau phụ âm","ge- + thân + -et","arbeiten → gearbeitet, öffnen → geöffnet"],
["Đuôi -ieren","không có ge-","studieren → studiert"],["Tiền tố không tách được (be-, emp-, ent-, er-, ge-, miss-, ver-, zer-)","không có ge-","besuchen → besucht, verstehen → verstanden"],
["Tiền tố tách được","tiền tố + ge + thân","einkaufen → eingekauft, anrufen → angerufen"],["Động từ mạnh","ge- + thân (thường đổi nguyên âm) + -en","gehen → gegangen, schreiben → geschrieben"])}
<p class="tip">Đừng đoán Partizip II của động từ mạnh; học thành bộ: gehen – ging – ist gegangen.</p>
<h3>3. Cách dùng Partizip II</h3>
<p>Perfekt (haben/sein + PII), Plusquamperfekt (hatte/war + PII), Passiv (werden + PII), và làm tính từ có chia đuôi: der geschrieben<b>e</b> Brief (= lá thư đã được viết), die angekommen<b>en</b> Gäste (= khách đã đến).</p>
<p class="tip">Partizip I → ĐANG làm (die weinende Frau). Partizip II → ĐÃ làm / ĐƯỢC làm (der reparierte Computer).</p>`,
ex:[F("schlafen → Partizip I:","schlafend","Infinitiv + d."),F("Das ___ Baby will nicht essen. (weinen)","weinende","das + Partizip I + đuôi -e (Nom., xác định)."),
F("Die ___ Kinder spielen im Park. (lachen)","lachenden","die (số nhiều) + đuôi -en."),F("Ein ___ Hund kam zu uns. (bellen)","bellender","ein + giống đực Nom. → đuôi -er."),
F("Er kam ___ nach Hause. (singen, làm trạng từ)","singend","Làm trạng từ → không chia đuôi."),F("kaufen → Partizip II:","gekauft","Động từ yếu: ge- + kauf + -t."),
F("arbeiten → Partizip II:","gearbeitet","Thân kết thúc -t → -et."),F("reparieren → Partizip II:","repariert","Đuôi -ieren → không ge-."),
F("bezahlen → Partizip II:","bezahlt","Tiền tố be- không tách → không ge-."),F("einladen → Partizip II:","eingeladen","Tiền tố tách được: ein + ge + laden."),
F("anrufen → Partizip II:","angerufen","an + ge + rufen (động từ mạnh, đuôi -en)."),F("verstehen → Partizip II:","verstanden","ver- không tách → không ge-; động từ mạnh."),
F("trinken → Partizip II:","getrunken","Động từ mạnh, đổi nguyên âm i → u."),F("mitbringen → Partizip II:","mitgebracht","mit + ge + bracht (động từ hỗn hợp)."),
F("Der ___ Brief liegt auf dem Tisch. (schreiben)","geschriebene","Lá thư đã được viết → Partizip II + đuôi -e."),F("Die ___ Gäste essen im Garten. (ankommen)","angekommenen","Khách đã đến → Partizip II + đuôi -en."),
MC("„Ich habe gestern gestudiert.“ – sửa lỗi:",["studiert","gestudieret","studierte"],"studiert","Đuôi -ieren không có ge-."),
MC("„eine zu erledigende Arbeit“ nghĩa là:",["một việc cần phải làm","một việc đã làm xong","một việc đang làm"],"một việc cần phải làm","zu + Partizip I = cần/phải được…"),
MC("„das gekochte Essen“ là:",["món ăn đã được nấu","món ăn đang nấu"],"món ăn đã được nấu","Partizip II → đã/được làm.")]}

const ARTS=["der","die","das"];
function mk(r,custom){const alts=r[2].split(" / ").map(a=>a.replace(/\s*\(.*?\)/g,"").trim());
 const nouns=alts.map(a=>{const p=a.split(" ");return ARTS.includes(p[0])&&p.length>1?p.slice(1).join(" "):a});
 return {lvl:r[0],topic:r[1],word:r[2],art:r[3],pl:r[4],vn:r[5],ex:r[6],alts,nouns,custom:!!custom}}
const BASE=RAW.map(r=>mk(r,false));
const KEY="wortschatz-a1b1-v2";
let st={box:{},ok:0,bad:0,custom:[]};
try{const s=localStorage.getItem(KEY);if(s)st=Object.assign(st,JSON.parse(s));
 else{const o=localStorage.getItem("wortschatz-a1b1-v1");if(o){const old=JSON.parse(o);st.ok=old.ok||0;st.bad=old.bad||0;
  for(const k in old.box||{}){if(BASE[k])st.box[BASE[k].word]=old.box[k]}}}}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){alert("Không lưu được trên trình duyệt này. Hãy thử Firefox.")}};
let W=[];function rebuild(){W=BASE.concat(st.custom.map(r=>mk(r,true)))}rebuild();
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let mode="list",cur=null,done=false,last=[],openWord=null;
const gcol=a=>({"der":"var(--der)","die":"var(--die)","das":"var(--das)","die (Pl.)":"var(--pl)"}[a]||"var(--muted)");
function filtered(){const l=$("level").value,t=$("topic").value;
 return W.filter(w=>(!l||(l==="mine"?w.custom:w.lvl===l))&&(!t||w.topic===t))}
function pool(){return filtered().filter(w=>mode!=="art"||ARTS.includes(w.art))}
function fillTopics(){const prev=$("topic").value;
 const ts=[...new Set(W.filter(w=>{const l=$("level").value;return !l||(l==="mine"?w.custom:w.lvl===l)}).map(w=>w.topic))];
 $("topic").innerHTML='<option value="">Mọi chủ đề</option>'+ts.map(t=>`<option${t===prev?" selected":""}>${esc(t)}</option>`).join("")}
function pick(){const p=pool();if(!p.length)return null;
 let tot=0;const ws=p.map(w=>{if(last.includes(w.word)&&p.length>8)return 0;const b=st.box[w.word]||0;const x=Math.pow(2,5-Math.min(b,5));tot+=x;return x});
 let r=Math.random()*tot;for(let i=0;i<p.length;i++){r-=ws[i];if(r<=0)return p[i]}return p[0]}

 $("known").textContent=k;$("total").textContent=W.length;$("progress").style.width=(100*k/W.length)+"%";

function renderList(){const q=$("search").value.trim().toLowerCase();

 const groups={};const order=[];items.forEach(w=>{const g=w.lvl+" · "+w.topic;if(!groups[g]){groups[g]=[];order.push(g)}groups[g].push(w)});

  const b=st.box[w.word]||0;const open=openWord===w.word;
  return `<div class="item" style="--g:${gcol(w.art)}" data-w="${esc(w.word)}">

   <div class="t">${esc(w.vn)}</div>
   ${open?`<div class="x"><div class="s">${w.pl&&w.pl!=="–"?"Số nhiều: "+esc(w.pl):"Thường không dùng số nhiều"} · ${boxLabel(b)}</div><div><i>${esc(w.ex)}</i></div>
   ${w.custom?`<div class="acts"><button data-edit="${esc(w.word)}">Sửa</button><button data-del="${esc(w.word)}">Xóa</button></div>`:""}</div>`:""}
  </div>`}).join("")).join("")}

function show(){$("answer").classList.remove("hidden");$("card").style.setProperty("--g",gcol(cur.art))}

function check(){if(done){next();return}const v=$("inp").value.trim().replace(/\s+/g," ");if(!v)return;
 const V=$("verdict");let ok=false;

 else if(cur.alts.some(a=>a.toLowerCase()===v.toLowerCase())){V.textContent="✓ Đúng — nhưng nhớ viết hoa danh từ";V.className="verdict warn";ok=true}
 else{const p=v.split(" ");const np=p.length>1&&ARTS.includes(p[0].toLowerCase())?p.slice(1).join(" "):v;
  if(cur.nouns.some(n=>n.toLowerCase()===np.toLowerCase())){V.textContent="✗ Đúng từ, sai hoặc thiếu mạo từ";V.className="verdict bad"}
  else{V.textContent="✗ Chưa đúng";V.className="verdict bad"}}
 grade(ok);show();done=true;$("btn-check").textContent="Từ tiếp theo"}
$("btn-check").onclick=check;$("inp").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();check()}});
$("btn-skip").onclick=()=>{if(!done){grade(false);show();done=true;$("verdict").textContent="Đáp án:";$("verdict").className="verdict";$("btn-check").textContent="Từ tiếp theo"}else next()};
document.querySelectorAll(".keys button").forEach(b=>b.onclick=()=>{const i=$("inp"),s=i.selectionStart??i.value.length,e=i.selectionEnd??s;
 i.value=i.value.slice(0,s)+b.dataset.k+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)});
document.querySelectorAll(".arts button").forEach(b=>b.onclick=()=>{if(done||!cur)return;done=true;const ok=b.dataset.a===cur.art;
 b.classList.add("on");const V=$("verdict2");V.textContent=ok?"✓ Chính xác!":`✗ Phải là „${cur.art}“`;V.className="verdict "+(ok?"ok":"bad");
 grade(ok);show();$("btn-next2").classList.remove("hidden")});
$("btn-next2").onclick=next;
function setMode(m){mode=m;
 document.querySelectorAll(".tabs button").forEach(x=>x.setAttribute("aria-selected",x.dataset.mode===m));
 $("listview").classList.toggle("hidden",m!=="list");$("card").classList.toggle("hidden",m==="list");
 $("ui-card").classList.toggle("hidden",m!=="card");$("ui-type").classList.toggle("hidden",m!=="type");$("ui-art").classList.toggle("hidden",m!=="art");
 window.scrollTo(0,0);next()}
document.querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>setMode(b.dataset.mode));
$("level").onchange=()=>{fillTopics();next()};$("topic").onchange=next;
$("reset").onclick=()=>{if(confirm("Xóa tiến độ học (giữ lại các từ bạn đã thêm)?")){st.box={};st.ok=0;st.bad=0;save();stats();next()}};
/* ---------- add / edit ---------- */
let editing=null;
function openForm(word){editing=word||null;$("f-err").textContent="";
 const ts=[...new Set(W.map(w=>w.topic))].sort((a,b)=>a.localeCompare(b,"de"));
 const curT=$("topic").value;
 $("f-topic").innerHTML=ts.map(t=>`<option${t===curT?" selected":""}>${esc(t)}</option>`).join("")+'<option value="__new">+ Chủ đề mới…</option>';
 $("f-newtopic").classList.add("hidden");$("f-newtopic").value="";
 if(editing){const r=st.custom.find(r=>r[2]===editing);$("f-title").textContent="Sửa từ";
  $("f-art").value=r[3];$("f-lvl").value=r[0];$("f-word").value=r[7]||r[2];$("f-pl").value=r[4]==="–"?"":r[4];$("f-vn").value=r[5];$("f-ex").value=r[6];$("f-topic").value=r[1]}
 else{$("f-title").textContent="Thêm từ mới";["f-word","f-pl","f-vn","f-ex"].forEach(i=>$(i).value="");
  const l=$("level").value;if(["A1","A2","B1"].includes(l))$("f-lvl").value=l}
 $("sheet").classList.remove("hidden");setTimeout(()=>$("f-word").focus(),50)}
$("f-topic").onchange=()=>{const n=$("f-topic").value==="__new";$("f-newtopic").classList.toggle("hidden",!n);if(n)$("f-newtopic").focus()};
$("btn-add").onclick=()=>openForm();
$("f-cancel").onclick=()=>$("sheet").classList.add("hidden");
$("sheet").addEventListener("click",e=>{if(e.target.id==="sheet")$("sheet").classList.add("hidden")});
$("f-save").onclick=()=>{let noun=$("f-word").value.trim().replace(/\s+/g," ");const art=$("f-art").value;
 const p=noun.split(" ");if(p.length>1&&ARTS.includes(p[0].toLowerCase()))noun=p.slice(1).join(" ");
 const vn=$("f-vn").value.trim();let topic=$("f-topic").value==="__new"?$("f-newtopic").value.trim():$("f-topic").value;
 if(!noun){$("f-err").textContent="Hãy nhập từ tiếng Đức.";return}
 if(!vn){$("f-err").textContent="Hãy nhập nghĩa tiếng Việt.";return}
 if(!topic){$("f-err").textContent="Hãy chọn hoặc đặt tên chủ đề.";return}
 noun=noun.charAt(0).toUpperCase()+noun.slice(1);
 const a=art.replace(" (Pl.)","");const word=(a?a+" ":"")+noun+(art==="die (Pl.)"?" (Pl.)":"");
 if(W.some(w=>w.word.toLowerCase()===word.toLowerCase()&&w.word!==editing)){$("f-err").textContent="Từ này đã có trong danh sách.";return}
 const row=[$("f-lvl").value,topic,word,art,$("f-pl").value.trim()||"–",vn,$("f-ex").value.trim()||"—",noun];
 if(editing){const i=st.custom.findIndex(r=>r[2]===editing);if(editing!==word&&st.box[editing]!=null){st.box[word]=st.box[editing];delete st.box[editing]}st.custom[i]=row}
 else st.custom.push(row);
 save();rebuild();$("sheet").classList.add("hidden");
 $("level").value="";fillTopics();$("topic").value=topic;openWord=word;$("search").value="";stats();setMode("list");
 const el=[...document.querySelectorAll(".item")].find(x=>x.dataset.w===word);if(el)el.scrollIntoView({block:"center"})};
/* ---------- backup ---------- */
$("btn-export").onclick=()=>{if(!st.custom.length){alert("Bạn chưa thêm từ nào.");return}
 const blob=new Blob([JSON.stringify({custom:st.custom,box:st.box},null,1)],{type:"application/json"});
 const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="tu-cua-toi.json";document.body.appendChild(a);a.click();a.remove()};
$("btn-import").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{try{const d=JSON.parse(rd.result);let n=0;
 (d.custom||[]).forEach(r=>{if(Array.isArray(r)&&r.length>=7&&!W.some(w=>w.word===r[2])){st.custom.push(r);n++}});
 for(const k in d.box||{})if(st.box[k]==null)st.box[k]=d.box[k];
 save();rebuild();fillTopics();stats();next();alert(`Đã nhập ${n} từ.`)}catch(err){alert("File không hợp lệ.")}};rd.readAsText(f);e.target.value=""};
$("level").insertAdjacentHTML("beforeend",'<option value="mine">Từ của tôi</option>');
fillTopics();stats();setMode("list");

/* ---------- grammar ---------- */
st.gram=st.gram||{};
const MIX={id:"mix",title:"Ôn tổng hợp",ex:[]};
let gq={lesson:null,items:[],i:0,score:0,wrong:[],done:false};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
function gShow(v){["g-list","g-lesson","g-quiz"].forEach(x=>$(x).classList.toggle("hidden",x!==v));window.scrollTo(0,0)}
function renderLessons(){
 $("g-list").innerHTML=`<button class="btn mixed" id="g-mix">Ôn tổng hợp – 20 câu ngẫu nhiên</button>`+LESSONS.map((l,i)=>{const b=st.gram[l.id];
  return `<div class="lesson" data-l="${l.id}"><div class="n">${i+1}</div><div class="b"><div class="tt">${esc(l.title)}</div><div class="ss">${esc(l.sub)} · ${l.ex.length} câu</div></div>
  <span class="pill${b>=80?" good":""}">${b==null?l.lvl:"Tốt nhất "+b+"%"}</span></div>`}).join("");
 $("g-mix").onclick=()=>{MIX.ex=shuffle(LESSONS.flatMap(l=>l.ex.map(e=>Object.assign({from:l.title},e)))).slice(0,20);startQuiz(MIX,MIX.ex)};
 document.querySelectorAll(".lesson").forEach(el=>el.onclick=()=>openLesson(LESSONS.find(l=>l.id===el.dataset.l)))}
function openLesson(l){gq.lesson=l;$("gl-lvl").textContent="Trình độ "+l.lvl;$("gl-title").textContent=l.title;$("gl-theory").innerHTML=l.theory;
 $("gl-start").textContent=`Làm bài tập (${l.ex.length} câu)`;gShow("g-lesson")}
$("gl-start").onclick=()=>startQuiz(gq.lesson,gq.lesson.ex);
$("g-back1").onclick=()=>{renderLessons();gShow("g-list")};
$("g-back2").onclick=()=>{if(gq.lesson.id==="mix"){renderLessons();gShow("g-list")}else gShow("g-lesson")};
function startQuiz(l,items){gq={lesson:l,items:shuffle(items),i:0,score:0,wrong:[],done:false,full:items.length===l.ex.length};
 $("gq-card").classList.remove("hidden");$("gq-end").classList.add("hidden");gShow("g-quiz");showQ()}
function showQ(){const q=gq.items[gq.i];gq.done=false;
 $("gq-name").textContent=q.from||gq.lesson.title;$("gq-pos").textContent=`Câu ${gq.i+1}/${gq.items.length}`;
 $("gq-bar").style.width=(100*gq.i/gq.items.length)+"%";$("gq-q").textContent=q.q;
 $("gq-verdict").textContent="";$("gq-verdict").className="verdict";$("gq-ex").classList.add("hidden");
 $("gq-btn").textContent="Kiểm tra";$("gq-btn").classList.toggle("hidden",q.t==="mc");
 if(q.t==="mc"){$("gq-fill").classList.add("hidden");
  $("gq-opts").innerHTML=shuffle(q.opts).map(o=>`<button data-o="${esc(o)}">${esc(o)}</button>`).join("");
  $("gq-opts").querySelectorAll("button").forEach(b=>b.onclick=()=>answer(b.dataset.o,b))}
 else{$("gq-opts").innerHTML="";$("gq-fill").classList.remove("hidden");$("gq-inp").value="";setTimeout(()=>$("gq-inp").focus(),50)}}
const norm=s=>s.toLowerCase().replace(/[,.!?;:„“"]/g," ").replace(/\s+/g," ").trim();
function answer(v,btn){if(gq.done)return;const q=gq.items[gq.i];let ok,note="";
 if(q.t==="mc"){ok=v===q.a;$("gq-opts").querySelectorAll("button").forEach(b=>{if(b.dataset.o===q.a)b.classList.add("right");else if(b===btn)b.classList.add("wrong")})}
 else{v=v.trim();if(!v)return;ok=q.a.some(a=>norm(a)===norm(v));if(ok&&!q.a.some(a=>a.trim()===v.replace(/\s+/g," ")))note=" (chú ý chữ hoa/thường: "+q.a[0]+")"}
 gq.done=true;const V=$("gq-verdict");
 if(ok){gq.score++;V.textContent="✓ Chính xác!"+note;V.className="verdict "+(note?"warn":"ok")}
 else{gq.wrong.push(q);V.textContent="✗ Đáp án đúng: "+(q.t==="mc"?q.a:q.a[0]);V.className="verdict bad"}
 $("gq-ex").textContent=q.ex;$("gq-ex").classList.remove("hidden");
 $("gq-btn").classList.remove("hidden");$("gq-btn").textContent=gq.i+1<gq.items.length?"Câu tiếp theo":"Xem kết quả";$("gq-btn").focus()}
$("gq-btn").onclick=()=>{if(!gq.done){answer($("gq-inp").value);return}gq.i++;if(gq.i<gq.items.length)showQ();else endQuiz()};
$("gq-inp").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();$("gq-btn").click()}});
$("gq-keys").querySelectorAll("button").forEach(b=>b.onclick=()=>{const i=$("gq-inp"),s=i.selectionStart??i.value.length,e=i.selectionEnd??s;
 i.value=i.value.slice(0,s)+b.dataset.k+i.value.slice(e);i.focus();i.setSelectionRange(s+1,s+1)});
function endQuiz(){const p=Math.round(100*gq.score/gq.items.length);
 if(gq.lesson.id!=="mix"&&gq.full){st.gram[gq.lesson.id]=Math.max(st.gram[gq.lesson.id]||0,p);save()}
 $("gq-card").classList.add("hidden");$("gq-end").classList.remove("hidden");
 $("gq-score").textContent=`${gq.score}/${gq.items.length}`;
 $("gq-msg").textContent=p===100?"Tuyệt vời, đúng hết!":p>=80?"Rất tốt! Làm lại vài câu sai là chắc chắn.":p>=50?"Khá ổn. Xem lại lý thuyết rồi làm lại câu sai nhé.":"Nên đọc lại lý thuyết trước khi làm lại.";
 $("gq-redo").classList.toggle("hidden",!gq.wrong.length);$("gq-theory").classList.toggle("hidden",gq.lesson.id==="mix")}
$("gq-redo").onclick=()=>{const w=gq.wrong,l=gq.lesson;startQuiz(l,w)};
$("gq-again").onclick=()=>startQuiz(gq.lesson,gq.lesson.id==="mix"?shuffle(LESSONS.flatMap(l=>l.ex.map(e=>Object.assign({from:l.title},e)))).slice(0,20):gq.lesson.ex);
$("gq-theory").onclick=()=>openLesson(gq.lesson);
document.querySelectorAll(".seg button").forEach(b=>b.onclick=()=>{const g=b.dataset.sec==="gram";
 document.querySelectorAll(".seg button").forEach(x=>x.setAttribute("aria-selected",x===b));
 $("vocab").classList.toggle("hidden",g);$("gram").classList.toggle("hidden",!g);if(g){renderLessons();gShow("g-list")}});
</script>
</body>
</html>
